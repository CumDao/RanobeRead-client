name: Create and publish a Docker image

on:
  push:
    branches: ['dev']
    tags:
      - 'v*'  # Также запускать при пуше тега, например, v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL='https://ranobe-read.ru/api/'
            VITE_GOOGLE_RECAPTCHA_SITE_KEY=''
            VITE_ENV='production'

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    runs-on: xeon-runner
    needs: build-and-push-image
    steps:
      - name: Pull Docker image
        run: docker pull ghcr.io/cumdao/ranoberead-client:latest

      - name: Stop and remove existing container
        run: |
          docker stop ranobe-container || true
          docker rm ranobe-container || true

      - name: Run Docker container
        run: |
          docker run -d --name ranobe-container -p 5000:5000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
